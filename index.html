
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Card</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #141e30, #243b55);
    font-family: Arial, sans-serif;
}

.card {
    width: 320px;
    padding: 30px;
    border-radius: 20px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,0.3);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-10px);
}

.profile-img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #4778f5;
    margin: 15px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
}

.card h2 {
    margin-bottom: 8px;
}

.card p {
    color: #cbd5e1;
    font-size: 14px;
}

.stats {
    display: flex;
    justify-content: space-around;
    margin: 25px 0;
}

.stats h3 {
    color: #7da5ff;
    font-size: 24px;
}

.stats p {
    margin-top: 5px;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #4778f5;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #2856d8;
}
</style>
</head>

<body>

<div class="card">

    <div class="profile-img">👨‍💻</div>

    <h2>John Developer</h2>
    <p>Full Stack Developer</p>

    <div class="stats">
        <div>
            <h3>24</h3>
            <p>Projects</p>
        </div>

        <div>
            <h3>98%</h3>
            <p>Success</p>
        </div>
    </div>

    <button onclick="showMessage()">
        View Profile
    </button>

</div>

<script>
function showMessage() {
    alert("Welcome to John Developer's Profile!");
}
</script>

</body>
</html>
